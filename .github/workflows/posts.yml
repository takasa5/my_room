# Notion の Posts（公開済みの新しい投稿）を取り直して posts.js を更新する。
# 公開 Notion サイトの API はブラウザから読めない（CORS）ので、ここで取得して静的ファイルとしてコミットする。
name: Update Posts

on:
  schedule:
    - cron: "20 20 * * *"  # 毎日 5:20 JST
  workflow_dispatch:        # Actions 画面から手動でも動かせる

permissions:
  contents: write   # posts.js をコミットする
  actions: write    # 更新後に deploy workflow を動かす

concurrency:
  group: posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Fetch Posts
        run: node scripts/fetch-posts.mjs 5

      # Notion の返す形が変わって中身が壊れたら、コミットせずに止める（前日の posts.js のまま残る）。
      # GITHUB_TOKEN での push では test workflow が動かないので、ここで確かめる。
      - name: Check data
        run: node scripts/check-data.js

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- posts.js; then
            echo "変更なし"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.js
          git commit -m "Notion の Posts を更新"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN での push では deploy workflow が動かないので、明示的に動かす
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
