# 一時的な確認用（確認が済んだら消す）。Google Health API の睡眠記録がどこまで遡れるかを調べる。
# ログは公開されるので、月ごとの件数だけを出し、時刻や睡眠時間は出さない。
name: Sleep probe (temporary)

on:
  push:
    branches: [claude/festive-heisenberg-6ekgdq]
    paths: [.github/workflows/sleep-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Count sleep sessions per month
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_HEALTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_HEALTH_REFRESH_TOKEN }}
        run: |
          cat > probe.mjs <<'EOF'
          const tok = await fetch("https://oauth2.googleapis.com/token", {
            method: "POST",
            headers: { "content-type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({
              client_id: process.env.GOOGLE_CLIENT_ID,
              client_secret: process.env.GOOGLE_CLIENT_SECRET,
              refresh_token: process.env.GOOGLE_HEALTH_REFRESH_TOKEN,
              grant_type: "refresh_token",
            }),
          });
          if (!tok.ok) { console.log("token: HTTP", tok.status); process.exit(1); }
          const { access_token } = await tok.json();

          const months = {}, keys = new Set();
          let pageToken = "", pages = 0, total = 0, naps = 0, withStages = 0;
          const filter = `sleep.interval.end_time >= "2015-01-01T00:00:00Z" AND sleep.interval.end_time < "${new Date().toISOString()}"`;
          do {
            const url = new URL("https://health.googleapis.com/v4/users/me/dataTypes/sleep/dataPoints");
            url.searchParams.set("filter", filter);
            url.searchParams.set("pageSize", "25");
            if (pageToken) url.searchParams.set("pageToken", pageToken);
            const res = await fetch(url, { headers: { authorization: `Bearer ${access_token}` } });
            if (!res.ok) { console.log("list: HTTP", res.status, "page", pages); break; }
            const body = await res.json();
            Object.keys(body).forEach((k) => keys.add("body." + k));
            for (const dp of body.dataPoints ?? []) {
              const s = dp.sleep ?? {};
              Object.keys(s).forEach((k) => keys.add("sleep." + k));
              const end = s.interval?.endTime, start = s.interval?.startTime;
              if (!end) continue;
              total++;
              if (start && new Date(end) - new Date(start) < 3 * 3600e3) naps++;
              if ((s.stages ?? []).length) withStages++;
              const m = end.slice(0, 7);
              months[m] = (months[m] ?? 0) + 1;
            }
            pageToken = body.nextPageToken ?? "";
            pages++;
          } while (pageToken && pages < 200);

          console.log(`pages=${pages} sessions=${total} shorter_than_3h=${naps} with_stages=${withStages} more_pages_left=${!!pageToken}`);
          console.log("fields:", [...keys].sort().join(", "));
          for (const m of Object.keys(months).sort()) console.log(m, months[m]);
          EOF
          node probe.mjs
