# GitHub の草と最近いじったリポジトリを取り直して github.js を更新する。
# 草は GraphQL API（トークンが要る）でしか取れないので、ここで取得して静的ファイルとしてコミットする。
name: Update GitHub

on:
  schedule:
    - cron: "10 20 * * *"  # 毎日 5:10 JST
  workflow_dispatch:        # Actions 画面から手動でも動かせる

permissions:
  contents: write   # github.js をコミットする
  actions: write    # 更新後に deploy workflow を動かす

concurrency:
  group: github
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Fetch GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-github.mjs takasa5 4 26

      # 取れた中身が壊れていたら、コミットせずに止める（前日の github.js のまま残る）。
      # GITHUB_TOKEN での push では test workflow が動かないので、ここで確かめる。
      - name: Check data
        run: node scripts/check-data.js

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- github.js; then
            echo "変更なし"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github.js
          git commit -m "GitHub の草とリポジトリを更新"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN での push では deploy workflow が動かないので、明示的に動かす
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
