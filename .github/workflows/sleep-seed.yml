# 一時的な workflow（済んだら消す）。作業ブランチの sleep.js を本物のデータで作り直してコミットする。
# ログには晩の数だけが出る（fetch-sleep.mjs は中身をログに出さない）。2 回目: 503 の取り直しを足した
name: Sleep seed (temporary)

on:
  push:
    branches: [claude/festive-heisenberg-6ekgdq]
    paths: [.github/workflows/sleep-seed.yml]

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch sleep.js and commit it to this branch
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_HEALTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_HEALTH_REFRESH_TOKEN }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git clone --depth 1 --branch "$BRANCH" "https://x-access-token:${TOKEN}@github.com/${REPO}.git" repo
          cd repo
          node scripts/fetch-sleep.mjs 26
          node scripts/check-data.js
          git rm -q .github/workflows/sleep-seed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sleep.js
          git commit -qm "sleep.js を本物のデータで作り直し、一時の workflow を消す"
          git push -q origin "HEAD:$BRANCH"
