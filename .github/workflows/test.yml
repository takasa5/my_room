name: test

on:
  push:
    branches: [main]
  pull_request:

# action が動くので、トークンは読むだけにする。
permissions:
  contents: read

jobs:
  # data.js の形が index.html と scene.js の期待どおりか。main へのマージがそのまま公開になるので、ここで止める。
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node scripts/check-data.js
