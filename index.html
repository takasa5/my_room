<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Room</title>
<meta name="description" content="自己紹介ページへの入口">
<!-- リンクを貼ったときのプレビュー。og:image は完全な URL でないと拾われない。画像は GitHub の Social preview と同じもの -->
<meta property="og:type" content="website">
<meta property="og:title" content="My Room">
<meta property="og:description" content="自己紹介ページへの入口">
<meta property="og:url" content="https://takasa5.github.io/my_room/">
<meta property="og:image" content="https://takasa5.github.io/my_room/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="夕暮れのデスクを文字の点描で描いた絵と、my_room の文字">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 点描は「暗い地の上で光る点」として描いているので、ダーク配色のみ */
  :root {
    color-scheme: dark;
    --bg: #15171c; --ink: #6b7382; --ink-strong: #c9ced8; --hot: #f2b45a;
    --panel: #1d2027; --line: #343a45; --night: #7f9cc9;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink-strong);
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 40px;
  }

  /* 画面には出さず、読み上げにだけ渡す（ページの見出しなど） */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  main { width: 100%; display: flex; flex-direction: column; align-items: center; }

  .stage {
    width: 100%; max-width: 1200px;
    position: relative;
  }
  /* 絵は本物のテキスト。文字ごとの色は <span> で付ける */
  pre#room {
    margin: 0; white-space: pre; overflow: hidden;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0;
    color: var(--ink);
  }
  /* 小物の文字は最初から inline-block にしておく（揺らす瞬間に組み直しが起きないように） */
  pre#room span[data-id] { cursor: pointer; display: inline-block; }
  /* ホバー時の暗転は、絵の上に重ねた幕 1 枚で行う（文字ごとに不透明度を変えると重い） */
  pre#room { position: relative; }
  pre#room::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: rgba(21, 23, 28, .58); opacity: 0; transition: opacity .12s;
  }
  pre#room.hovering::after { opacity: 1; }
  pre#room span.hot { position: relative; z-index: 1; }


  dialog {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-strong);
    padding: 0; width: min(460px, calc(100vw - 32px));
    font-family: inherit; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(10, 10, 14, .45); }
  .panel-head {
    display: flex; justify-content: flex-end; align-items: center;
    padding: 10px 14px; border-bottom: 1px dashed var(--line); font-size: 12px; color: var(--ink);
  }
  .panel-head button { font: inherit; background: none; border: none; color: var(--ink); cursor: pointer; font-size: 14px; }
  .panel-body { padding: 16px 18px 20px; }
  .panel-body h2 { font-size: 17px; margin: 0 0 14px; }
  .panel-body ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .panel-body a {
    display: block; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px;
    color: var(--ink-strong); text-decoration: none; font-size: 13px;
  }
  .panel-body a::before { content: "> "; color: var(--hot); }
  .panel-body a:hover, .panel-body a:focus-visible { border-color: var(--hot); color: var(--hot); }
  .panel-body img { display: block; max-width: 100%; height: auto; margin-top: 14px; border-radius: 4px; }
  .panel-body a.image-link { display: block; border: none; padding: 0; }
  .panel-body a.image-link::before { content: none; }
  .panel-body a.image-link:hover img, .panel-body a.image-link:focus-visible img { outline: 1px solid var(--hot); outline-offset: 2px; }
  .panel-body .covers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  .panel-body .covers img { width: 100%; aspect-ratio: 2 / 3; object-fit: contain; margin-top: 0; }
  .panel-body .covers .ph { aspect-ratio: 2 / 3; border-radius: 4px; background: var(--line); opacity: .4; }
  /* Notion の新しい投稿（日付・タグ・題名の一覧） */
  .panel-body .posts { margin-top: 14px; gap: 0; }
  .panel-body .posts a { border: none; border-bottom: 1px dashed var(--line); border-radius: 0; padding: 8px 2px; }
  .panel-body .posts a::before { content: none; }
  .panel-body .posts .meta { display: block; font-size: 11px; color: var(--ink); margin-bottom: 2px; }
  .panel-body .posts a:hover .meta, .panel-body .posts a:focus-visible .meta { color: inherit; }
  /* GitHub の草（1 列 = 1 週、上が日曜）。濃さは 0〜4 の 5 段階 */
  .panel-body .grass { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 2px; margin-top: 14px; }
  .panel-body .grass i { aspect-ratio: 1; border-radius: 1px; background: #262a33; }
  .panel-body .grass .l1 { background: #5a4526; } .panel-body .grass .l2 { background: #8a6530; }
  .panel-body .grass .l3 { background: #c08a40; } .panel-body .grass .l4 { background: var(--hot); }
  .panel-body a.grass-note {
    border: none; padding: 0; margin-top: 6px; font-size: 11px; color: var(--ink); text-align: right;
  }
  .panel-body a.grass-note::before { content: none; }
  .panel-body .repos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
  .panel-body .repos img { width: 100%; aspect-ratio: 2 / 1; object-fit: cover; margin-top: 0; }
  /* 睡眠（目覚まし時計）: 直近 4 週の平均と、直近 26 週の入眠〜起床のリボン */
  .panel-body .sleep { margin-top: 4px; }
  .panel-body .sleep .stats { display: grid; grid-template-columns: repeat(3, auto) 1fr; column-gap: 20px; align-items: end; margin-bottom: 10px; }
  .panel-body .sleep .stats div { display: flex; flex-direction: column; gap: 2px; }
  .panel-body .sleep .stats small { font-size: 10px; color: var(--ink); letter-spacing: .04em; }
  .panel-body .sleep .stats b { font-size: 16px; }
  .panel-body .sleep .stats .bed b { color: var(--night); }
  .panel-body .sleep .stats .wake b { color: var(--hot); }
  .panel-body .sleep .stats .span { font-size: 10px; color: var(--ink); text-align: right; }
  /* 長さ（7h 01m）は単位だけ小さく灰色にして、時刻（1:27）と見分けられるようにする */
  .panel-body .sleep .u { font-size: .68em; font-weight: 400; color: var(--ink); margin-left: 1px; }
  .panel-body .sleep svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  .panel-body .sleep svg text { font-family: inherit; }
  .panel-body .sleep .readout { font-size: 11px; color: var(--ink); margin-top: 6px; display: flex; justify-content: space-between; gap: 8px; }
  .panel-body .sleep .readout .now { color: var(--ink-strong); white-space: nowrap; }
  .panel-body .sleep .readout .now.none { color: var(--ink); }
  .panel-body .sleep .readout .u { font-size: .85em; }
  /* 日記帳は見開き（2 ページ）を並べるので、パネルを広げる */
  dialog.wide { width: min(860px, calc(100vw - 32px)); }
  .panel-body .diary { margin-top: 14px; }
  .panel-body .spread { display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-items: start; }
  .panel-body .spread .leaf { display: block; border: none; border-radius: 0; padding: 0; position: relative; }
  .panel-body .spread .leaf::before { content: none; }
  /* 写真は縦横比が少しずつ違うので、全ページ同じ枠にそろえて少しだけ伸び縮みさせる（切り取らない） */
  .panel-body .spread .leaf img { width: 100%; height: auto; object-fit: fill; margin-top: 0; border-radius: 0; background: var(--line); }
  .panel-body .spread .leaf .ph { display: block; width: 100%; background: var(--line); opacity: .4; }
  .panel-body .spread .leaf:first-child :is(img, .ph) { border-radius: 4px 0 0 4px; }
  .panel-body .spread .leaf:last-child :is(img, .ph) { border-radius: 0 4px 4px 0; }
  .panel-body .spread .leaf:hover img, .panel-body .spread .leaf:focus-visible img { outline: 1px solid var(--hot); outline-offset: -1px; }
  .panel-body .spread .leaf .cap { display: block; font-size: 11px; color: var(--ink); margin-top: 4px; text-align: center; }
  .panel-body .spread .leaf:hover .cap, .panel-body .spread .leaf:focus-visible .cap { color: var(--hot); }
  .panel-body .diary-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--ink); }
  .panel-body .diary-nav button {
    font: inherit; background: none; color: var(--ink-strong); cursor: pointer;
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px;
  }
  .panel-body .diary-nav button:hover:not(:disabled), .panel-body .diary-nav button:focus-visible { border-color: var(--hot); color: var(--hot); }
  .panel-body .diary-nav button:disabled { opacity: .35; cursor: default; }

  /* ---- 小物の一覧: スクロールすると小物の寄りの AA と名前が順に現れる ---- */
  .things { width: 100%; max-width: 1200px; margin-top: 96px; }
  .things ol {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 64px 44px;
    grid-auto-rows: 1fr;                 /* どの行のカードも同じ高さ */
  }
  .thing { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s ease; }
  .thing.in { opacity: 1; transform: none; }
  .thing pre.crop {
    margin: 0 0 16px; white-space: pre; overflow: hidden;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0;
    color: var(--ink);
  }
  .thing h3 { font-size: 15px; margin: 4px 0 8px; font-weight: 700; }
  .thing .card { display: block; height: 100%; color: inherit; text-decoration: none; }
  /* リンク先のない小物のカードは、押すとパネルを開くボタン */
  .thing button.card { font: inherit; background: none; border: 0; padding: 0; width: 100%; text-align: left; cursor: pointer; }
  .thing .card:hover h3, .thing .card:focus-visible h3 { color: var(--hot); }
  .thing .card:hover pre.crop { filter: brightness(1.25); }
  .thing .card:focus-visible { outline: 1px solid var(--hot); outline-offset: 8px; }
  @media (prefers-reduced-motion: reduce) { .thing { transition: none; opacity: 1; transform: none; } }

  footer { margin-top: 28px; font-size: 11px; color: var(--ink); }
  footer a { color: inherit; }
</style>
</head>
<body>
  <main>
  <h1 class="sr-only">My Room</h1>
  <!-- 点描は 1 万字を超える文字なので、読み上げでは外側を 1 枚の絵として扱い、中の文字は隠す（pre に role="img" だけでは子の文字が残る） -->
  <div class="stage" role="img" aria-label="夕暮れのデスクを文字の点描で描いた絵。小物を押すとページが開きます。下の一覧にも同じ内容があります。">
    <pre id="room" aria-hidden="true"></pre>
  </div>

  <section class="things" aria-labelledby="things-title">
    <h2 id="things-title" class="sr-only">小物の一覧</h2>
    <ol id="things"></ol>
  </section>
  </main>

  <dialog id="panel" aria-labelledby="panel-title">
    <div class="panel-head">
      <button type="button" id="panel-close" aria-label="[x] 閉じる">[x]</button>
    </div>
    <div class="panel-body">
      <h2 id="panel-title"></h2>
      <ul id="panel-links"></ul>
      <div id="panel-extra"></div>
    </div>
  </dialog>

  <footer>source: <a id="src" href="#" target="_blank" rel="noopener">Notion</a></footer>

  <script src="data.js?v=18"></script>
  <script src="filmarks.js"></script>
  <script src="github.js"></script>
  <script src="posts.js"></script>
  <script src="diary.js"></script>
  <script src="sleep.js"></script>
  <script src="scene.js?v=24"></script>
  <script>
  (async function () {
    const data = window.ROOM_DATA;
    const items = data.items;
    const pre = document.getElementById("room");
    const panel = document.getElementById("panel");
    document.getElementById("src").href = data.top;

    // 文字変換のスタイル（scene.js の STYLES。?style=B のように切り替え可）
    const STYLE_KEY = new URLSearchParams(location.search).get("style") || "F";
    const STYLE = Scene.STYLES[STYLE_KEY] || Scene.STYLES.F;
    // 画面幅に応じて解像度（文字数）を決める
    const COLS = window.innerWidth < 700 ? Math.min(STYLE.cols, 150) : STYLE.cols;
    const CELL_ASPECT = 1.75;            // セルの 高さ/幅
    const ROWS = Math.round(COLS / CELL_ASPECT / 1.8);

    let hot = null;

    // ---- 文字サイズ: COLS 文字がちょうど幅に収まるように ----------------
    let advance = 0.6;                   // 1 文字の幅 / font-size（実測で更新）
    function measure() {
      const probe = document.createElement("span");
      probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:100px 'JetBrains Mono', ui-monospace, Menlo, monospace";
      probe.textContent = "@".repeat(100);
      document.body.append(probe);
      advance = probe.getBoundingClientRect().width / 100 / 100;
      probe.remove();
    }
    function fit() {
      const w = pre.parentElement.clientWidth;
      const fs = w / (COLS * advance);
      pre.style.fontSize = fs + "px";
      pre.style.lineHeight = (fs * advance * CELL_ASPECT) + "px";
      pre.style.height = (fs * advance * CELL_ASPECT * ROWS) + "px";
    }

    // ---- テキスト化: 同じ色・同じ物の連続をひとつの <span> にまとめる ----
    const q = (v) => Math.min(255, Math.round(v * 255 / 6) * 6);
    const hex = (c) => "#" + c.map((v) => q(v).toString(16).padStart(2, "0")).join("");
    const esc = (c) => (c === "<" ? "&lt;" : c === ">" ? "&gt;" : c === "&" ? "&amp;" : c);
    function rowHTML(sc, y) {
      let html = "", run = "", runColor = null, runId = null;
      const flush = () => {
        if (!run) return;
        const idAttr = runId ? ` data-id="${runId}"` : "";
        html += runColor ? `<span style="color:${runColor}"${idAttr}>${run}</span>` : (idAttr ? `<span${idAttr}>${run}</span>` : run);
        run = "";
      };
      for (let x = 0; x < COLS; x++) {
        const i = y * COLS + x, c = sc.ch[i];
        const id = sc.ids[i] && items[sc.ids[i]] ? sc.ids[i] : null;
        if (c === " ") {               // 空白は色を持たないので直前の塊に混ぜる
          if (id !== runId) { flush(); runId = id; runColor = null; }
          run += " "; continue;
        }
        const color = hex(sc.col[i]);
        if (id !== runId || (runColor && color !== runColor)) { flush(); runId = id; }
        runColor = color;
        run += esc(c);
      }
      flush();
      return html;
    }

    // 小物ごとの <span> 一覧（描き終わってから作る）
    let spansById = {};
    function indexSpans() {
      spansById = {};
      for (const el of pre.querySelectorAll("span[data-id]")) (spansById[el.dataset.id] ||= []).push(el);
    }
    const spansOf = (id) => spansById[id] || [];

    // 押したときの揺れ。Web Animations で transform だけを動かす（レイアウトを触らない）
    const PUSH = [
      { transform: "translateX(0)" },
      { transform: "translateX(.9ch)", offset: 0.3 },
      { transform: "translateX(-.4ch)", offset: 0.6 },
      { transform: "translateX(0)" }
    ];
    // 揺れ始めてからパネルを開くまでの待ち時間（ms）。0 で揺れと同時
    const PANEL_DELAY = 0;
    function pushAnim(id) {
      for (const el of spansOf(id)) el.animate(PUSH, { duration: 320, easing: "ease-out" });
    }

    // ---- 操作 ---------------------------------------------------------

    function setHot(id) {
      if (hot === id) return;
      if (hot) spansOf(hot).forEach((el) => el.classList.remove("hot"));
      hot = id;
      if (id) spansOf(id).forEach((el) => el.classList.add("hot"));
      pre.classList.toggle("hovering", !!id);
    }
    function open(id) {
      const it = items[id];
      pushAnim(id);
      setTimeout(() => {
        document.getElementById("panel-title").textContent = it.title;
        document.getElementById("panel-links").replaceChildren(...(it.links || []).map((l) => {
          const li = document.createElement("li"), a = document.createElement("a");
          a.href = l.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = l.label;
          li.append(a); return li;
        }));
        const extra = document.getElementById("panel-extra");
        extra.replaceChildren();
        const di = it.diary && window.DIARY;        // diary.js が無い・空なら何も出さない
        panel.classList.toggle("wide", !!(di && di.pages.length));
        if (di && di.pages.length) extra.append(diaryPart(di));
        if (it.image) {
          const img = imageFor(it.image, it.imageSize);
          img.alt = "最近聴いた曲";
          if (it.imageLink) {                  // 画像を押すと別タブでそのページへ
            const a = document.createElement("a");
            a.href = it.imageLink; a.target = "_blank"; a.rel = "noopener";
            a.className = "image-link"; a.append(img);
            extra.append(a);
          } else extra.append(img);
        }
        if (it.booklog) {
          const box = document.createElement("div");
          box.className = "covers";
          // 届くまでは同じ大きさの枠を置いて、表紙が来ても高さが跳ねないようにする
          box.replaceChildren(...Array.from({ length: it.booklog.count }, () => {
            const ph = document.createElement("div"); ph.className = "ph"; return ph;
          }));
          extra.append(box);                   // 届く前に別のパネルへ移ったら box ごと捨てられる
          loadBooklog(it.booklog).then((books) => books.length ? box.replaceChildren(...books.map((b) => {
            const a = document.createElement("a"), img = document.createElement("img");
            a.href = b.url; a.target = "_blank"; a.rel = "noopener";
            a.className = "image-link"; a.title = b.title;
            img.src = b.image; img.alt = b.title;
            a.append(img); return a;
          })) : box.remove()).catch(() => box.remove());   // 取れない・0 冊なら何も出さない
        }
        const fm = it.filmarks && window.FILMARKS;   // filmarks.js が無い・空なら何も出さない
        if (fm && fm.works.length) {
          const box = document.createElement("div");
          box.className = "covers";
          box.replaceChildren(...fm.works.map((w) => {
            const a = document.createElement("a"), img = document.createElement("img");
            a.href = w.url; a.target = "_blank"; a.rel = "noopener";
            a.className = "image-link"; a.title = w.title + (w.rating ? "  ★" + w.rating : "");
            img.src = w.image; img.alt = w.title;
            a.append(img); return a;
          }));
          extra.append(box);
        }
        const gh = it.github && window.GITHUB;      // github.js が無ければ何も出さない
        if (gh) extra.append(...githubParts(gh));
        const po = it.posts && window.POSTS;        // posts.js が無い・空なら何も出さない
        const sl = it.sleep && window.SLEEP;       // sleep.js が無い・記録が 1 晩もなければ何も出さない
        if (sl && sl.nights.some(Boolean)) extra.append(sleepPart(sl));
        if (po && po.posts.length) {
          const ul = document.createElement("ul");
          ul.className = "posts";
          ul.setAttribute("aria-label", "新しい投稿");
          ul.replaceChildren(...po.posts.map((p) => {
            const li = document.createElement("li"), a = document.createElement("a"), meta = document.createElement("span");
            a.href = p.url; a.target = "_blank"; a.rel = "noopener";
            meta.className = "meta"; meta.textContent = [p.date.replaceAll("-", "."), ...p.tags.map((t) => "#" + t)].join("  ");
            a.append(meta, p.title);
            li.append(a); return li;
          }));
          extra.append(ul);
        }
        panel.showModal();
      }, PANEL_DELAY);
    }

    // 日記帳: 古い順に 1・2 枚目、3・4 枚目…を見開きで並べ、前後へめくる。最初は一番新しい見開きを開く。
    // 写真は今の見開きと前後の見開きの分だけ読む（全部を一度には読まない）
    let diarySpread = null;                    // 今開いている見開きの番号（パネルを閉じても覚えておく）
    function diaryPart(di) {
      const pages = di.pages, last = Math.ceil(pages.length / 2) - 1;
      // めくってもパネルの高さが変わらないよう、全ページの縦横比（高さ÷幅）の平均を、どの写真の枠にも使う。
      // 写真ごとの差は数 % なので、枠に合わせて少し伸び縮みさせても目立たない
      const ratio = pages.reduce((sum, p) => sum + p.ratio, 0) / pages.length;
      if (diarySpread === null || diarySpread > last) diarySpread = last;
      const box = document.createElement("div"), spread = document.createElement("div"), nav = document.createElement("div");
      box.className = "diary"; spread.className = "spread"; nav.className = "diary-nav";
      const prev = document.createElement("button"), next = document.createElement("button"), where = document.createElement("span");
      prev.type = next.type = "button";
      prev.textContent = "< 前"; next.textContent = "次 >";
      prev.setAttribute("aria-label", "前の見開き"); next.setAttribute("aria-label", "次の見開き");
      where.setAttribute("aria-live", "polite");
      nav.append(prev, where, next);
      box.append(spread, nav);

      const leaf = (p, ratio) => {
        if (!p) { const blank = document.createElement("span"); blank.className = "leaf"; return blank; }
        const a = document.createElement("a"), img = document.createElement("img"), cap = document.createElement("span");
        a.href = p.url; a.target = "_blank"; a.rel = "noopener"; a.className = "leaf"; a.title = p.title;
        img.src = p.image; img.alt = "日記 " + p.title;
        img.style.aspectRatio = "1 / " + ratio;     // 写真の縦横比ではなく見開きの枠に合わせる（届くまでも同じ枠を取る）
        cap.className = "cap"; cap.textContent = p.title;
        img.addEventListener("error", () => {   // 写真が取れなければ同じ大きさの空の紙にする（リンクと題は残す）
          const ph = document.createElement("span"); ph.className = "ph"; ph.style.aspectRatio = img.style.aspectRatio;
          img.replaceWith(ph);
        });
        a.append(img, cap); return a;
      };
      const preload = (n) => [pages[n * 2], pages[n * 2 + 1]].forEach((p) => { if (p) new Image().src = p.image; });
      function show(n) {
        diarySpread = n;
        spread.replaceChildren(leaf(pages[n * 2], ratio), leaf(pages[n * 2 + 1], ratio));
        prev.disabled = n <= 0; next.disabled = n >= last;
        where.textContent = `${n + 1} / ${last + 1}`;
        if (n > 0) preload(n - 1);
        if (n < last) preload(n + 1);
      }
      prev.addEventListener("click", () => { if (diarySpread > 0) show(diarySpread - 1); });
      next.addEventListener("click", () => { if (diarySpread < last) show(diarySpread + 1); });
      box.turn = (d) => (d < 0 ? prev : next).click();   // パネルの ← → から呼ぶ
      show(diarySpread);
      return box;
    }

    // GitHub の草（直近 gh.weeks 週）と、最近いじったリポジトリのカード画像（github.js）
    function githubParts(gh) {
      const parts = [];
      if (gh.levels.length) {
        const grass = document.createElement("div");
        grass.className = "grass";
        grass.setAttribute("role", "img");
        grass.setAttribute("aria-label", `GitHub の草（直近 ${gh.weeks} 週で ${gh.total} contributions）`);
        grass.replaceChildren(...gh.levels.map((v) => {
          const i = document.createElement("i");
          if (v) i.className = "l" + v;
          return i;
        }));
        const note = document.createElement("a");
        note.href = gh.url; note.target = "_blank"; note.rel = "noopener";
        note.className = "grass-note"; note.textContent = `${gh.total} contributions in the last ${gh.weeks} weeks ↗`;
        parts.push(grass, note);
      }
      if (gh.repos.length) {
        const box = document.createElement("div");
        box.className = "repos";
        box.replaceChildren(...gh.repos.map((r) => {
          const a = document.createElement("a"), img = document.createElement("img");
          a.href = r.url; a.target = "_blank"; a.rel = "noopener";
          a.className = "image-link"; a.title = r.name;
          img.src = r.image; img.alt = r.name;
          img.addEventListener("error", () => a.remove());   // 取れないカードは消す
          a.append(img); return a;
        }));
        parts.push(box);
      }
      return parts;
    }

    // 睡眠: 直近 4 週の平均（入眠・起床・睡眠時間）と、直近 sl.weeks 週の「入眠〜起床」を 7 晩の平均でつないだリボン（sleep.js）。
    // 記録のない晩はリボンを切って前後を点線でつなぎ、軸の下に ▴ を付ける。グラフに触るとその晩の時刻が下に出る
    function sleepPart(sl) {
      const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      // nights[i] は start から i 日目の夜。[入眠, 起床, 睡眠時間]（分。入眠・起床はその夜の日付の 0:00 から数える）か null
      const nights = sl.nights.map((v, i) => {
        const date = new Date(Date.parse(sl.start + "T00:00:00Z") + i * 864e5);
        return v ? { date, bed: v[0], wake: v[1], asleep: v[2] } : { date, missing: true };
      });
      const clock = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`; };
      const dur = (m) => { m = Math.round(m); return `${Math.floor(m / 60)}<small class="u">h</small> ${String(m % 60).padStart(2, "0")}<small class="u">m</small>`; };
      const nightOf = (n) => `${n.date.getUTCMonth() + 1}/${n.date.getUTCDate()} ${DOW[n.date.getUTCDay()]}`;
      const avg7 = (key) => nights.map((n, i) => {
        if (n.missing) return null;
        const xs = nights.slice(Math.max(0, i - 6), i + 1).filter((m) => !m.missing);
        return xs.reduce((s, m) => s + m[key], 0) / xs.length;
      });
      const bedAvg = avg7("bed"), wakeAvg = avg7("wake");
      const runs = [];                          // 続けて記録のある区間 [最初, 最後]
      nights.forEach((n, i) => { if (n.missing) return; const r = runs[runs.length - 1]; if (r && r[1] === i - 1) r[1] = i; else runs.push([i, i]); });
      const recent = nights.slice(-28).filter((n) => !n.missing);
      const mean = (k) => recent.reduce((s, n) => s + n[k], 0) / recent.length;
      const lastI = runs[runs.length - 1][1];

      const box = document.createElement("div");
      box.className = "sleep";
      box.innerHTML = (recent.length ? `<div class="stats">
          <div class="bed"><small>Bedtime</small><b>${clock(mean("bed"))}</b></div>
          <div class="wake"><small>Wake-up</small><b>${clock(mean("wake"))}</b></div>
          <div><small>Time asleep</small><b>${dur(mean("asleep"))}</b></div>
          <span class="span">avg · 4 weeks</span></div>` : "") +
        `<svg role="img" aria-label="直近 ${sl.weeks} 週の入眠と起床の時刻"></svg>
        <div class="readout"><span class="now"></span><span>last ${sl.weeks} weeks</span></div>`;
      const svg = box.querySelector("svg"), out = box.querySelector(".now");

      // 縦軸: 上が夜、下が朝。95% の晩が収まるよう偶数時の 2 時間刻みで広げる（少なくとも 22 時〜翌 10 時）。
      // 数晩だけの外れ（昼過ぎまで寝ていた日など）で軸が伸びないよう、はみ出した分はグラフの枠で切る。
      // 目盛りの文字は 4 時間おき（0:00・4:00・8:00…）
      const all = nights.filter((n) => !n.missing);
      const pct = (xs, p) => xs.sort((a, b) => a - b)[Math.min(xs.length - 1, Math.floor(xs.length * p))];
      const Y0 = Math.min(22 * 60, Math.floor(pct(all.map((n) => n.bed), 0.05) / 120) * 120);
      const Y1 = Math.max(34 * 60, Math.ceil(pct(all.map((n) => n.wake), 0.95) / 120) * 120);
      let geo = null;
      function draw() {
        const W = Math.round(svg.clientWidth); if (!W || (geo && geo.W === W)) return;
        const H = Math.round(W * 0.54), L = 34, R = 6, T = 6, B = 26;
        const y = (m) => T + ((m - Y0) / (Y1 - Y0)) * (H - T - B);
        const step = (W - L - R) / nights.length, x = (i) => L + (i + 0.5) * step, f = (v) => v.toFixed(1);
        geo = { W, H, T, B, L, step, x, y, f };
        let s = `<defs><linearGradient id="sleep-aurora" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7f9cc9" stop-opacity=".6"/><stop offset=".55" stop-color="#a99bb4" stop-opacity=".35"/><stop offset="1" stop-color="#f2b45a" stop-opacity=".5"/></linearGradient>
          <clipPath id="sleep-plot"><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"/></clipPath></defs>`;
        for (let m = Y0; m <= Y1; m += 120) {
          s += `<line x1="${L}" x2="${W - R}" y1="${f(y(m))}" y2="${f(y(m))}" stroke="#262a33"/>`;
          if (m % 240 === 0) s += `<text x="${L - 6}" y="${f(y(m) + 3)}" font-size="9" fill="#6b7382" text-anchor="end">${clock(m)}</text>`;
        }
        nights.forEach((n, i) => {
          if (n.date.getUTCDate() === 1) s += `<line x1="${f(x(i))}" x2="${f(x(i))}" y1="${T}" y2="${H - B}" stroke="#262a33" stroke-dasharray="2 3"/><text x="${f(x(i) + 3)}" y="${H - 6}" font-size="9" fill="#6b7382">${MON[n.date.getUTCMonth()]}</text>`;
        });
        s += `<g clip-path="url(#sleep-plot)">`;
        // 毎晩の記録は背景にかすかに
        nights.forEach((n, i) => { if (!n.missing) s += `<line x1="${f(x(i))}" x2="${f(x(i))}" y1="${f(y(n.bed))}" y2="${f(y(n.wake))}" stroke="#c9ced8" stroke-opacity=".09" stroke-width="${Math.max(step * 0.8, 0.8).toFixed(2)}"/>`; });
        // リボンは区間ごと。1 晩だけの区間は細い柱にする
        for (const [a, b] of runs) {
          const top = [], bot = [];
          for (let i = a; i <= b; i++) { top.push([x(i), y(bedAvg[i])]); bot.push([x(i), y(wakeAvg[i])]); }
          if (a === b) for (const e of [top, bot]) e.splice(0, 1, [e[0][0] - step * 0.4, e[0][1]], [e[0][0] + step * 0.4, e[0][1]]);
          const pts = (arr) => arr.map((p) => f(p[0]) + " " + f(p[1])).join("L");
          s += `<path class="ribbon" d="M${pts([...top, ...[...bot].reverse()])}Z" fill="url(#sleep-aurora)"/>` +
            `<path d="M${pts(top)}" stroke="var(--night)" stroke-width="1" fill="none"/><path d="M${pts(bot)}" stroke="var(--hot)" stroke-width="1" fill="none"/>`;
        }
        for (let k = 1; k < runs.length; k++) {
          const a = runs[k - 1][1], b = runs[k][0];
          for (const [arr, color] of [[bedAvg, "var(--night)"], [wakeAvg, "var(--hot)"]])
            s += `<line class="gap" x1="${f(x(a))}" y1="${f(y(arr[a]))}" x2="${f(x(b))}" y2="${f(y(arr[b]))}" stroke="${color}" stroke-dasharray="1.5 2.5" stroke-opacity=".7"/>`;
        }
        s += `</g>`;
        nights.forEach((n, i) => { if (n.missing && i > runs[0][0]) s += `<path d="M${f(x(i) - 2)} ${H - B + 6}L${f(x(i) + 2)} ${H - B + 6}L${f(x(i))} ${H - B + 2.5}Z" fill="#6b7382"/>`; });
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        svg.innerHTML = s + `<g class="hover"></g>`;
        show(lastI);
      }
      function show(i) {
        if (!geo) return;
        const n = nights[i], { T, H, B, step, x, y, f } = geo;
        svg.querySelector(".hover").innerHTML = `<rect x="${f(x(i) - step / 2)}" y="${T}" width="${Math.max(step, 2).toFixed(2)}" height="${H - T - B}" fill="#c9ced8" fill-opacity=".08"/>` +
          (n.missing ? "" : `<circle cx="${f(x(i))}" cy="${f(y(n.bed))}" r="3" fill="var(--night)" stroke="var(--panel)"/><circle cx="${f(x(i))}" cy="${f(y(n.wake))}" r="3" fill="var(--hot)" stroke="var(--panel)"/>`);
        out.className = "now" + (n.missing ? " none" : "");
        out.innerHTML = n.missing ? `${nightOf(n)}  — no record` : `${nightOf(n)}  ${clock(n.bed)} → ${clock(n.wake)}  ${dur(n.asleep)}`;
      }
      const pick = (e) => {
        if (!geo) return;
        const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
        const p = pt.matrixTransform(svg.getScreenCTM().inverse());
        show(Math.max(0, Math.min(nights.length - 1, Math.floor((p.x - geo.L) / geo.step))));
      };
      svg.addEventListener("pointermove", pick);
      svg.addEventListener("pointerdown", pick);
      svg.addEventListener("pointerleave", () => show(lastI));
      new ResizeObserver(draw).observe(svg);   // パネルが開いて幅が決まってから描く。幅が変わったら描き直す
      return box;
    }

    // ブクログの本棚を読む。API に CORS ヘッダーがないので fetch ではなく JSONP で読む。
    const booklogCache = {};
    function loadBooklog({ user, count, status = 0 }) {
      const key = user + "/" + count + "/" + status;
      return booklogCache[key] || (booklogCache[key] = new Promise((resolve, reject) => {
        const cb = "__booklog_" + Object.keys(booklogCache).length;
        const s = document.createElement("script");
        const done = () => { clearTimeout(timer); delete window[cb]; s.remove(); };
        const fail = () => { done(); delete booklogCache[key]; reject(new Error("booklog")); };  // 次に開いたとき取り直す
        const https = (u) => typeof u === "string" && u.startsWith("https://");
        window[cb] = (res) => {
          done();
          resolve((res && res.books || []).filter((b) => https(b.url) && https(b.image))
            .map((b) => ({ url: b.url, image: b.image, title: String(b.title || "") })));
        };
        const timer = setTimeout(fail, 10000);   // 返事が来ないまま待ち続けない
        s.onerror = fail;                        // 通信エラー・404 など
        // 200 で届いたのに callback が呼ばれなかった（空の応答など）。callback は script の実行中に呼ばれるので、load 時点で残っていれば未呼び出し
        s.onload = () => { if (window[cb]) fail(); };
        s.src = "https://api.booklog.jp/v2/json/" + encodeURIComponent(user) +
          "?count=" + encodeURIComponent(count) + "&status=" + encodeURIComponent(status) + "&callback=" + cb;
        document.head.append(s);
      }));
    }

    // パネルに出す画像（last.fm）。開く前に読んでおき、開いたときはその <img> をそのまま使う。
    // 古くなったら（IMAGE_TTL 超え）読み直す。失敗した画像は捨てて、次に開いたとき取り直す。
    const IMAGE_TTL = 5 * 60 * 1000;
    const imageCache = {};   // url -> { img, at, failed }
    function imageFor(url, size) {
      const hit = imageCache[url];
      if (hit && !hit.failed && Date.now() - hit.at < IMAGE_TTL) return hit.img;
      const img = new Image(), entry = (imageCache[url] = { img, at: Date.now(), failed: false });
      if (size) {                              // 届くまでは同じ縦横比の枠を取って、高さが跳ねないようにする
        img.style.width = "100%"; img.style.aspectRatio = size[0] + " / " + size[1];
        img.addEventListener("load", () => { img.style.width = ""; img.style.aspectRatio = ""; });
      }
      img.addEventListener("error", () => {    // 取れなければ画像（とそのリンク）ごと消す
        entry.failed = true; (img.closest(".image-link") || img).remove();
      });
      img.src = url;
      return img;
    }

    // パネルを開く前に、画像と本の一覧・表紙を読んでおく（開いたときにはもう手元にある状態にする）
    Object.values(items).filter((it) => it.image).forEach((it) => imageFor(it.image, it.imageSize));
    const preloaded = [];
    Object.values(items).filter((it) => it.booklog).forEach((it) => {
      loadBooklog(it.booklog)
        .then((books) => books.forEach((b) => { const im = new Image(); im.src = b.image; preloaded.push(im); }))
        .catch(() => {});                      // 失敗はパネルを開いたときに改めて扱う
    });
    if (window.FILMARKS && Object.values(items).some((it) => it.filmarks)) {
      window.FILMARKS.works.forEach((w) => { const im = new Image(); im.src = w.image; preloaded.push(im); });
    }
    if (window.GITHUB && Object.values(items).some((it) => it.github)) {
      window.GITHUB.repos.forEach((r) => { const im = new Image(); im.src = r.image; preloaded.push(im); });
    }

    const idOf = (e) => { const el = e.target.closest && e.target.closest("span[data-id]"); return el ? el.dataset.id : null; };
    pre.addEventListener("mouseover", (e) => setHot(idOf(e)));
    pre.addEventListener("mouseleave", () => setHot(null));
    pre.addEventListener("click", (e) => {
      if (String(window.getSelection())) return;   // 文字を選択しただけのときは開かない
      const id = idOf(e); if (id) open(id);
    });
    document.getElementById("panel-close").addEventListener("click", () => panel.close());
    panel.addEventListener("click", (e) => { if (e.target === panel) panel.close(); });
    panel.addEventListener("keydown", (e) => {        // 日記帳は ← → でもめくれる
      const diary = panel.querySelector(".diary");
      if (!diary || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
      e.preventDefault(); diary.turn(e.key === "ArrowLeft" ? -1 : 1);
    });

    // ---- 小物の一覧（カード） ----------------------------------------
    const thingsEl = document.getElementById("things");
    const cards = Object.entries(items).map(([id, it]) => {
      const li = document.createElement("li");
      li.className = "thing";
      // カード全体（寄りの AA と名前）が 1 つのリンク
      // リンク先がない小物（目覚まし時計）は、押すとパネルを開くボタンにする
      const inner = `<pre class="crop" aria-hidden="true"></pre><h3></h3>`;
      if (it.links && it.links.length) {
        li.innerHTML = `<a class="card" target="_blank" rel="noopener">${inner}</a>`;
        li.querySelector("a.card").href = it.links[0].url;
      } else {
        li.innerHTML = `<button type="button" class="card">${inner}</button>`;
        li.querySelector("button.card").addEventListener("click", () => open(id));
      }
      li.querySelector("h3").textContent = it.title;
      const crop = li.querySelector("pre.crop");
      thingsEl.append(li);
      return { id, li, crop, done: false };
    });


    // ---- 寄りの AA: 小物のまわりだけを高い解像度で描き直す ----------------
    let boxes = {};                      // id -> 本番の絵での範囲（セル）
    function computeBoxes(sc) {
      boxes = {};
      for (let i = 0; i < sc.ids.length; i++) {
        const id = sc.ids[i]; if (!id || !items[id]) continue;
        const x = i % COLS, y = (i / COLS) | 0;
        const b = boxes[id] ||= { x0: x, y0: y, x1: x, y1: y };
        if (x < b.x0) b.x0 = x; if (x > b.x1) b.x1 = x; if (y < b.y0) b.y0 = y; if (y > b.y1) b.y1 = y;
      }
    }
    function cropHTML(sc, focus) {
      const out = [];
      for (let y = 0; y < sc.rows; y++) {
        let html = "", run = "", runColor = null;
        const flush = () => { if (run) html += runColor ? `<span style="color:${runColor}">${run}</span>` : run; run = ""; };
        for (let x = 0; x < sc.cols; x++) {
          const i = y * sc.cols + x, c = sc.ch[i];
          if (c === " ") { run += " "; continue; }
          const k = sc.ids[i] === focus ? 1 : 0.3;      // 主役以外は沈める
          const color = hex(sc.col[i].map((v) => v * k));
          if (runColor && color !== runColor) flush();
          runColor = color; run += esc(c);
        }
        flush(); out.push(html);
      }
      return out.join("\n");
    }
    // 寄りの AA はすべて同じ枠（横 CROP_W 字 × 縦 CROP_H 行）で切り出す
    const CROP_W = 96, CROP_H = 42;
    function fitCrop(card) {
      const w = card.crop.clientWidth;
      const fs = Math.min(15, w / (CROP_W * advance));
      const lh = fs * advance * CELL_ASPECT;
      card.crop.style.fontSize = fs + "px";
      card.crop.style.lineHeight = lh + "px";
      card.crop.style.height = (lh * CROP_H) + "px";   // 描く前から高さを確保しておく
    }
    async function renderCrop(card) {
      const b = boxes[card.id]; if (!b) return;
      const pad = 2, bw = b.x1 - b.x0 + 1 + pad * 2, bh = b.y1 - b.y0 + 1 + pad * 2;
      // 小物が枠いっぱいに収まる倍率（小さい物ほど大きく寄る）
      const k = Math.max(1, Math.min(4, CROP_W / bw, CROP_H / bh));
      const VC = Math.round(COLS * k), VR = Math.round(ROWS * k);
      // 小物の中心を枠の中心に。絵の端にかかるときは内側へずらす
      const cx = (b.x0 + b.x1 + 1) / 2 * k, cy = (b.y0 + b.y1 + 1) / 2 * k;
      const x0 = Math.max(0, Math.min(VC - CROP_W, Math.round(cx - CROP_W / 2)));
      const y0 = Math.max(0, Math.min(VR - CROP_H, Math.round(cy - CROP_H / 2)));
      const sc = Scene.stylize(await Scene.render(VC, VR, CELL_ASPECT, null, [x0, y0, x0 + CROP_W, y0 + CROP_H]), STYLE);
      card.crop.innerHTML = cropHTML(sc, card.id);
    }

    // ---- レンダリング（上から少しずつ現像する） ------------------------
    try { await document.fonts.load('12px "JetBrains Mono"'); } catch (_) {}
    measure();
    fit();
    new ResizeObserver(fit).observe(pre.parentElement);
    let shown = 0;
    const base = await Scene.render(COLS, ROWS, CELL_ASPECT, (y, part) => new Promise((res) => {
      const sc = Scene.stylize(part, STYLE, y + 1);
      let html = "";
      for (; shown <= y; shown++) html += (shown ? "\n" : "") + rowHTML(sc, shown);
      pre.insertAdjacentHTML("beforeend", html);
      indexSpans();
      requestAnimationFrame(res);
    }));
    // 全行がそろってから、隣の行を参照する処理（輪郭のほんのり強調）込みで描き直す
    const sc = Scene.stylize(base, STYLE);
    const rows = [];
    for (let y = 0; y < ROWS; y++) rows.push(rowHTML(sc, y));
    pre.innerHTML = rows.join("\n");
    indexSpans();
    pre.dataset.ready = "1";             // 描き終わり（確認用の目印）

    // スクロールして見えてきたカードから順に、寄りの AA を描いてふわっと出す
    computeBoxes(sc);
    let queue = Promise.resolve();
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        const card = cards.find((c) => c.li === e.target);
        io.unobserve(card.li);
        card.li.classList.add("in");
        queue = queue.then(() => renderCrop(card)).then(() => new Promise(requestAnimationFrame));
      }
    }, { rootMargin: "0px 0px 200px 0px" });
    cards.forEach((c) => { fitCrop(c); io.observe(c.li); });
    new ResizeObserver(() => cards.forEach(fitCrop)).observe(thingsEl);
  })();
  </script>
</body>
</html>
